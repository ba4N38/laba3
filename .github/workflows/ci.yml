name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/mortgage-calculator
  VENV: /home/user/.ci-venv

jobs:
  build:
    name: Lint & tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (cached venv)
        run: |
          test -x "$VENV/bin/python" || python3 -m venv "$VENV"
          new_hash=$(sha256sum requirements.txt | cut -d' ' -f1)
          old_hash=$(cat "$VENV/.requirements.sha" 2>/dev/null || true)
          if [ "$new_hash" != "$old_hash" ]; then
            "$VENV/bin/pip" install -q -r requirements.txt
            echo "$new_hash" > "$VENV/.requirements.sha"
          else
            echo "Dependencies unchanged, using cached venv"
          fi
      - name: flake8
        run: $VENV/bin/python -m flake8 --max-line-length=120 --exclude=.git,__pycache__,.venv .
      - name: pytest
        run: $VENV/bin/python -m pytest -q

  deploy:
    name: Deploy to production
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Publish and restart service
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            ./ "$DEPLOY_DIR/"
          sudo -n systemctl restart mortgage-calculator
          sleep 1
          curl -fsS "http://127.0.0.1:8000/?principal=1000000&rate=10&years=10" | grep -q "13215.07"
